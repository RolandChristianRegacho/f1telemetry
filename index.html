<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 25 Telemetry</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#12161d;--panel:#1b212b;--line:#2a323f;--text:#e9edf2;--dim:#8a95a5;--thr:#38d39f;--brk:#ff4d5e;--drs:#4db8ff;--warn:#ffb020}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px Barlow,system-ui,sans-serif;padding:16px;max-width:1100px;margin-inline:auto}
h1{font:700 22px "Barlow Condensed",sans-serif;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline}
#status{font:600 13px Barlow,sans-serif;color:var(--dim)}#status.live{color:var(--thr)}
#revs{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin-bottom:12px}
#revs i{height:12px;border-radius:6px;background:var(--line)}
#revs i.on{background:var(--thr)}#revs i.on.m{background:var(--brk)}#revs i.on.h{background:var(--drs)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.wide{grid-column:1/-1}
.big{display:flex;gap:28px;align-items:flex-end}
.gear{font:700 150px/0.85 "Barlow Condensed",sans-serif}
.num{font:700 64px/1 "Barlow Condensed",sans-serif}.unit{color:var(--dim);font-size:14px;margin-left:4px}
.lbl{color:var(--dim);font-size:13px;margin-bottom:4px}
.pedal{height:14px;background:var(--line);border-radius:7px;overflow:hidden;margin:4px 0 12px}
.pedal b{display:block;height:100%;width:0}
#drs{display:inline-block;padding:2px 10px;border-radius:5px;background:var(--line);color:var(--dim);font-weight:600}
#drs.on{background:var(--drs);color:#062033}
canvas{width:100%;height:170px;display:block}
.tyres{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tyre{border:1px solid var(--line);border-radius:6px;padding:8px}
.tyre .t{font:700 26px "Barlow Condensed",sans-serif}
.tyre small{color:var(--dim);display:block}
.lap{display:flex;gap:36px;flex-wrap:wrap;margin-bottom:10px}
#lapTable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
#lapTable td{padding:5px 8px;border-top:1px solid var(--line)}
#lapTable tr.best td{color:var(--thr);font-weight:600}#lapTable tr.bad td:nth-child(2){color:var(--warn)}
.wear{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}.wear b{display:block;height:100%;background:var(--thr)}
@media(max-width:700px){.grid{grid-template-columns:1fr}.gear{font-size:110px}}
</style>
</head>
<body>
<h1>F1 25 Telemetry <span id="status">Waiting for data…</span></h1>
<div id="revs"></div>
<div class="grid">
  <div class="panel big">
    <div><div class="lbl">Gear</div><div class="gear" id="gear">N</div></div>
    <div><div class="lbl">Speed</div><div><span class="num" id="speed">0</span><span class="unit">km/h</span></div>
      <div class="lbl" style="margin-top:10px">RPM</div><div><span class="num" style="font-size:36px" id="rpm">0</span></div></div>
    <div style="margin-left:auto"><span id="drs">DRS</span></div>
  </div>
  <div class="panel">
    <div class="lbl">Throttle <span id="thrV"></span></div><div class="pedal"><b id="thr" style="background:var(--thr)"></b></div>
    <div class="lbl">Brake <span id="brkV"></span></div><div class="pedal"><b id="brk" style="background:var(--brk)"></b></div>
    <div class="lbl">Steering <span id="strV"></span></div><div class="pedal"><b id="str" style="background:var(--dim)"></b></div>
    <div class="lbl">Engine temperature: <span id="eng">–</span> °C</div>
  </div>
  <div class="panel wide"><div class="lbl">Last 10 seconds: speed, throttle, brake</div><canvas id="chart"></canvas></div>
  <div class="panel wide">
    <div class="lap">
      <div><div class="lbl">Lap <span id="lapNum">–</span> · Sector <span id="sec">–</span></div><div class="num" id="cur">–:––.–––</div></div>
      <div><div class="lbl">Last lap</div><div class="num" id="lastLap">–:––.–––</div></div>
      <div><div class="lbl">Best lap</div><div class="num" id="bestLap" style="color:var(--thr)">–:––.–––</div></div>
    </div>
    <table id="lapTable"><tbody></tbody></table>
  </div>
  <div class="panel wide">
    <div class="lbl">Tyres: surface / inner temperature (°C), pressure (psi), brake temperature (°C)</div>
    <div class="tyres" id="tyres"></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const revs = $('revs'); for (let i = 0; i < 15; i++) revs.appendChild(document.createElement('i'));
const names = ['Rear left', 'Rear right', 'Front left', 'Front right'], order = [2, 3, 0, 1]; // show front row first
$('tyres').innerHTML = order.map(i => `<div class="tyre"><small>${names[i]}</small><div class="t" id="ty${i}">–</div><small id="tp${i}"></small><small id="tw${i}">Wear –</small><div class="wear"><b id="tb${i}" style="width:0"></b></div></div>`).join('');
const hist = [], MAX = 300; // ~10 s at 30 Hz
let lastMsg = 0;

function draw() {
  const c = $('chart'), dpr = devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  g.strokeStyle = '#2a323f'; g.lineWidth = 1;
  for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(0, h * i / 4); g.lineTo(w, h * i / 4); g.stroke(); }
  const line = (key, max, color) => {
    g.strokeStyle = color; g.lineWidth = 2; g.beginPath();
    hist.forEach((d, i) => { const x = i / (MAX - 1) * w, y = h - Math.min(1, d[key] / max) * (h - 4) - 2; i ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.stroke();
  };
  line('speed', 350, '#e9edf2'); line('throttle', 1, '#38d39f'); line('brake', 1, '#ff4d5e');
}

function render(d) {
  $('gear').textContent = d.gear < 0 ? 'R' : d.gear === 0 ? 'N' : d.gear;
  $('speed').textContent = d.speed; $('rpm').textContent = d.rpm;
  $('drs').classList.toggle('on', !!d.drs);
  $('thr').style.width = d.throttle * 100 + '%'; $('thrV').textContent = Math.round(d.throttle * 100) + '%';
  $('brk').style.width = d.brake * 100 + '%'; $('brkV').textContent = Math.round(d.brake * 100) + '%';
  $('str').style.width = (d.steer + 1) * 50 + '%'; $('strV').textContent = (d.steer * 100).toFixed(0) + '%';
  $('eng').textContent = d.engineTemp;
  [...revs.children].forEach((el, i) => {
    el.className = i < d.revPct / 100 * 15 ? 'on ' + (i < 5 ? '' : i < 10 ? 'm' : 'h') : '';
  });
  // Rev strip: green first 5 lights, red next 5, blue last 5 (like the real wheel)
  [...revs.children].forEach((el, i) => { if (el.classList.contains('on')) el.className = 'on ' + (i < 5 ? '' : i < 10 ? 'm' : 'h'); });
  for (let i = 0; i < 4; i++) {
    const warn = d.tyreInner[i] > 110 ? 'color:var(--warn)' : '';
    $('ty' + i).innerHTML = `<span style="${warn}">${d.tyreSurf[i]} / ${d.tyreInner[i]}</span>`;
    $('tp' + i).textContent = `${d.tyrePress[i].toFixed(1)} psi · brake ${d.brakesTemp[i]}°`;
  }
  hist.push(d); if (hist.length > MAX) hist.shift();
}

const fmt = ms => { if (!ms) return '–:––.–––'; const m = Math.floor(ms / 60000), s = ((ms % 60000) / 1000).toFixed(3).padStart(6, '0'); return m + ':' + s; };
function renderLap(d) {
  if (d.lap) {
    $('lapNum').textContent = d.lap.num; $('sec').textContent = d.lap.sector + 1;
    $('cur').textContent = fmt(d.lap.cur); $('lastLap').textContent = fmt(d.lap.last);
  }
  const valid = (d.laps || []).filter(l => !l.invalid), best = valid.length ? Math.min(...valid.map(l => l.ms)) : 0;
  $('bestLap').textContent = fmt(best);
  $('lapTable').tBodies[0].innerHTML = (d.laps || []).slice().reverse().slice(0, 8).map(l =>
    `<tr class="${l.ms === best ? 'best' : ''} ${l.invalid ? 'bad' : ''}"><td>Lap ${l.lap}</td><td>${fmt(l.ms)}${l.invalid ? ' (invalid)' : ''}</td><td>${best && !l.invalid ? '+' + ((l.ms - best) / 1000).toFixed(3) : ''}</td></tr>`).join('');
  if (d.wear) d.wear.forEach((w, i) => { $('tw' + i).textContent = 'Wear ' + w + '%'; $('tb' + i).style.width = Math.min(100, w) + '%'; $('tb' + i).style.background = w > 60 ? 'var(--brk)' : w > 40 ? 'var(--warn)' : 'var(--thr)'; });
}
const es = new EventSource('/stream');
es.onmessage = e => { lastMsg = Date.now(); $('status').textContent = 'Live'; $('status').className = 'live'; const d = JSON.parse(e.data);
  if (d.warn) { $('status').textContent = d.warn; $('status').className = ''; return; }
  render(d); renderLap(d); };
es.onerror = () => { $('status').textContent = 'Server disconnected'; $('status').className = ''; };
setInterval(() => { if (lastMsg && Date.now() - lastMsg > 2000) { $('status').textContent = 'No data from game'; $('status').className = ''; } }, 1000);
(function loop() { draw(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
